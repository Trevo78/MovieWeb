<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Confused Breakfast Movie Web</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0f2238; --deep:#091627; --paper:#e6edf3; --navy:#12263d; --muted:#5b6f85;
  --line:#c5d1dd; --gold:#d9a441; --print:#f7f9fb;
  --cond:"Barlow Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --body:"Barlow","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--body);color:var(--navy);background:var(--deep);display:grid;grid-template-columns:1fr 348px;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* stage */
#stage{position:relative;overflow:hidden;background:var(--ink);touch-action:none;cursor:grab;min-height:0}
#stage.panning{cursor:grabbing}
#threads{position:absolute;inset:0;width:100%;height:100%}
#labels{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.node{position:absolute;left:0;top:0;width:66px;height:99px;margin:-49px 0 0 -33px;padding:0;border:0;background:none;cursor:pointer;transition:opacity .25s,width .4s,height .4s,margin .4s}
.pin{position:absolute;inset:0;background:var(--print);border:2px solid var(--print);box-shadow:0 3px 10px rgba(3,10,20,.55);transition:transform .2s}
.pin img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
.node.has-img .pin img{display:block}
.card{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:5px;text-align:center;
  font:600 10.5px/1.1 var(--cond);color:var(--print);background:#27476b;overflow:hidden;overflow-wrap:break-word;hyphens:auto}
.node.ph .pin{background:none;border:2px dashed #7f97b2;box-shadow:none}
.node.ph .card{background:none;color:#a9bdd3;font-size:34px}
.fmt{position:absolute;left:-6px;bottom:-6px;padding:1px 5px;font:700 11px/1.3 var(--cond);background:#0a1829;color:#fff;border:1px solid #6f8cab;border-radius:3px}
.fmt.f4K{background:var(--gold);color:#201500}
.fmt.fBlu-ray{background:#2f7fd6}
.fmt.fCriterion{background:#fff;color:#111}
.cap{position:absolute;left:50%;top:calc(100% + 6px);transform:translateX(-50%);white-space:nowrap;padding:1px 6px;font:600 12px/1.35 var(--cond);
  color:var(--print);background:rgba(9,22,39,.88);border-radius:2px;opacity:0;pointer-events:none;transition:opacity .15s}
.node:hover,.node.sel,.node.lit{z-index:5}
.node.sel{z-index:6}
.node:hover .cap,.node.sel .cap,.node.lit .cap{opacity:1}
.node:hover .pin{transform:scale(1.12)}
.node.sel .pin{transform:scale(1.25);border-color:var(--gold)}
.node.sel .cap{top:calc(125% + 8px);font-size:14px}
.node.dim{opacity:.1}
.node.quiet{opacity:.16}
.node.quiet:hover{opacity:.7}
.node.dim:hover{opacity:.6}

/* controls */
#bar{position:absolute;left:14px;top:14px;right:14px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;pointer-events:none}
#bar>*{pointer-events:auto}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 8px;border:1px solid #35506f;border-radius:999px;background:#0a1829;
  color:#d7e2ee;font:500 13px/1.3 var(--body)}
.chip i{width:14px;height:3px;border-radius:2px;background:var(--c)}
.chip b{font-weight:500;color:#8ea4bb}
.chip[aria-pressed="false"]{color:#7389a1;border-style:dashed}
.chip[aria-pressed="false"] i{background:#3c536d}
#find{width:150px;padding:5px 10px;border:1px solid #35506f;border-radius:999px;background:#0a1829;color:#fff;font:400 13px var(--body)}
#find::placeholder{color:#7f95ad}
#zoom{position:absolute;left:14px;bottom:14px;display:flex;gap:6px;align-items:center}
#zoom button{height:34px;min-width:34px;padding:0 12px;border:1px solid #35506f;border-radius:999px;background:#0a1829;color:#d7e2ee;font:500 13px var(--body)}
#zoom button[data-z]{padding:0;font:500 20px/1 var(--body)}
#zoom button:hover{border-color:#6f8cab;color:#fff}

.seg{display:inline-flex;border:1px solid #5d7896;border-radius:999px;overflow:hidden;background:#0a1829}
.seg button{border:0;background:none;padding:5px 13px;color:#b9c8d8;font:600 13px/1.3 var(--body)}
.seg button+button{border-left:1px solid #35506f}
.seg button[aria-pressed="true"]{background:var(--gold);color:#201500}
#genre{padding:5px 10px;border:1px solid #35506f;border-radius:999px;background:#0a1829;color:#d7e2ee;font:500 13px/1.3 var(--body)}
.scores{margin:2px 0 16px}
.scores div{display:grid;grid-template-columns:62px 1fr 42px;gap:10px;align-items:center;padding:3px 0;font:500 15px var(--cond);color:var(--muted)}
.scores i{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.scores b{display:block;height:100%;background:#7d90a5}
.scores em{font-style:normal;font-weight:700;text-align:right;color:var(--navy)}
.scores .on{color:var(--navy);font-weight:700}
.scores .on b{background:var(--gold)}
.avg{font:500 16px var(--cond);color:var(--muted);margin:12px 0 0}
.avg b{color:var(--navy);font-weight:700}

.also{margin:16px 0 0;font-size:15px}.also a{color:var(--navy);font-weight:600}
.credit{margin:8px 0 0;font-size:13px;color:var(--muted)}
.tabs{display:flex;margin:22px 0 0;border:1px solid var(--navy);border-radius:999px;overflow:hidden}
.tabs button{flex:1 1 auto;border:0;background:none;padding:7px 2px;font:600 13.5px/1.2 var(--cond);color:var(--navy);white-space:nowrap;min-width:0}
.tabs button+button{border-left:1px solid var(--navy)}
.tabs button[aria-pressed="true"]{background:var(--navy);color:var(--paper)}
.tabs + h3,.tabs + .note + h3{border-top:0;padding-top:0;margin-top:18px}
.note{font-size:13.5px;color:var(--muted);margin:14px 0 0}
h3 .dot{display:inline-block;width:14px;height:3px;border-radius:2px;background:var(--c);margin-right:8px;vertical-align:middle}
ul.feat .who{font:600 17px/1.2 var(--cond);text-decoration:none}
ul.feat .who:hover{text-decoration:underline}
ul.feat .n{white-space:nowrap}
ul.feat small{font-weight:500;font-size:13px;margin-left:6px}

.miss{margin:10px 0 0;font-size:13.5px;color:var(--muted)}
.miss summary{cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
.miss p{font-size:13.5px;margin:8px 0 0;user-select:all}

.crumbs{display:flex;flex-wrap:wrap;gap:4px 18px;margin-bottom:14px}
.crumbs .back{margin:0;text-align:left}
.crumbs [data-back]{font-weight:600;color:var(--navy)}

/* in a picked view the titles and scores are meant to be read from across the room */
.node.lit .cap,.node.sel .cap{font-size:24px;line-height:1.08;white-space:normal;width:max-content;max-width:220px;text-align:center;padding:4px 9px;top:calc(100% + 16px)}
.node.sel .cap{top:calc(112% + 18px)}
.node.lit .fmt,.node.sel .fmt{font-size:22px;padding:2px 8px;left:-12px;bottom:-12px;border-radius:4px}

/* bio card */
#bio{position:absolute;right:14px;bottom:14px;width:min(340px,calc(100% - 28px));max-height:calc(100% - 90px);overflow:auto;padding:16px 18px 14px;
  background:var(--paper);color:var(--navy);border-radius:4px;box-shadow:0 10px 30px rgba(3,10,20,.6);cursor:auto}
#bio[hidden]{display:none}
#bio h4{font:700 26px/1.05 var(--cond);margin:0 28px 10px 0}
#bio .role{display:flex;align-items:center;gap:7px;margin:0 0 2px;font:500 14px var(--cond);color:var(--muted)}
#bio .role i{width:14px;height:3px;border-radius:2px;background:var(--c)}
#bio img{float:right;width:84px;margin:2px 0 8px 12px;border-radius:2px}
#bio p{font-size:14.5px;line-height:1.45;margin:0 0 10px}
#bio .quiet,#bio .src{color:var(--muted)}
#bio .src{font-size:13px;margin:0;clear:both}
#bio a{color:var(--navy)}
#bio .x{position:absolute;right:8px;top:6px;width:30px;height:30px;border:0;background:none;font:400 24px/1 var(--body);color:var(--muted)}
#bio .x:hover{color:var(--navy)}
aside .role{display:flex;flex-wrap:wrap;gap:4px 14px;margin:0 0 4px;font:500 15px var(--cond);color:var(--muted)}
aside .role span{display:inline-flex;align-items:center;gap:7px}
aside .role i{width:14px;height:3px;border-radius:2px;background:var(--c)}
.pbio{margin-top:10px}
.pbio img{float:right;width:92px;margin:2px 0 8px 14px;border-radius:2px}
.pbio .quiet,.pbio .src{color:var(--muted)}
.pbio .src{font-size:13px;clear:both}
.pbio a{color:var(--navy)}
.pbio::after{content:"";display:block;clear:both}
.who{border:0;background:none;padding:0;font:inherit;color:inherit;text-align:left;text-decoration:underline dotted;text-decoration-color:#93a4b6;text-underline-offset:3px}
.who:hover{text-decoration-style:solid;text-decoration-color:currentColor}

/* panel */
aside{background:var(--paper);overflow-y:auto;padding:26px 24px 40px;border-left:1px solid #000}
h1{font:700 36px/.98 var(--cond);margin:0 0 8px;letter-spacing:-.01em;text-wrap:balance}
h2{font:700 34px/1 var(--cond);margin:0 0 6px;text-wrap:balance}
h3{font:600 17px/1.2 var(--cond);margin:26px 0 8px;padding-top:12px;border-top:1px solid var(--line)}
p{margin:0 0 10px;line-height:1.45;font-size:15px}
.meta{color:var(--muted);font-size:14px;margin-bottom:16px}
.tag{display:inline-block;padding:0 6px;margin-left:4px;border-radius:2px;font:700 12px/1.5 var(--cond);background:#31465e;color:#fff;vertical-align:1px}
.tag.f4K{background:var(--gold);color:#201500}.tag.fBlu-ray{background:#2f7fd6}.tag.fCriterion{background:#fff;color:#111;border:1px solid #111}
/* poster billing block */
dl.bill{margin:0;font-family:var(--cond)}
dl.bill div{display:grid;grid-template-columns:104px 1fr;gap:8px;padding:3px 0}
dl.bill dt{font-size:13px;font-weight:500;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding-top:2px}
dl.bill dd{margin:0;font-size:17px;font-weight:600;line-height:1.2}
ul.links,ul.top{list-style:none;margin:0;padding:0}
ul.links>li{padding:8px 0;border-bottom:1px solid var(--line)}
ul.links>li:last-child{border-bottom:0}
.go{display:block;width:100%;text-align:left;border:0;background:none;padding:0;font:600 18px/1.2 var(--cond)}
.go span{font-weight:500;color:var(--muted);margin-left:4px}
.go:hover{text-decoration:underline}
.why{margin:3px 0 0;padding:0;list-style:none;font-size:14px;line-height:1.4}
.why li{display:flex;gap:7px;align-items:baseline}
.why i{flex:none;width:12px;height:3px;border-radius:2px;background:var(--c);transform:translateY(-3px)}
.why em{font-style:normal;color:var(--muted)}
ul.top li{display:flex;justify-content:space-between;align-items:baseline;padding:4px 0}
ul.top .n{font:600 15px var(--cond);color:var(--muted)}
ul.how{margin:0 0 4px;padding-left:18px;font-size:15px;line-height:1.5}
.back{border:0;background:none;padding:0;margin-bottom:14px;color:var(--muted);font-size:14px;text-decoration:underline}

@media (max-width:820px){
  body{grid-template-columns:1fr;grid-template-rows:56vh 44vh}
  aside{border-left:0;border-top:1px solid #000;padding:18px 18px 30px}
  h1{font-size:34px} h2{font-size:28px}
  #find{width:110px}
}
@media (prefers-reduced-motion:reduce){.pin,.node,.cap{transition:none}}
</style>
</head>

      ctx.lineWidth = pass ? Math.max(2.5, 2.2/view.k) : Math.max(1.2, 1.2/view.k);
      for (const id of g.movies){ const m = N[id]; if (m.off) continue; ctx.beginPath(); ctx.moveTo(g.x, g.y); ctx.lineTo(m.x+m.dx, m.y+m.dy); ctx.stroke(); }
    }
  }
  tctx.textAlign = "center"; tctx.textBaseline = "middle";
  if (selTag){
    /* picked name: the name in the middle, a branch out to each of its movies */
    const g = selTag;
    ctx.globalAlpha = .92; ctx.strokeStyle = g.T.color; ctx.lineWidth = 4;
    for (const id of g.movies){ const m = N[id]; ctx.beginPath(); ctx.moveTo(g.x, g.y); ctx.lineTo(m.x+m.dx, m.y+m.dy); ctx.stroke(); }
    tctx.font = `700 40px ${FONT}`; tctx.globalAlpha = 1;
    const w = tctx.measureText(g.name).width + 46, h = 62;
    tctx.fillStyle = "#091627"; tctx.strokeStyle = g.T.color; tctx.lineWidth = 2.5;
    tctx.beginPath(); tctx.roundRect(g.x-w/2, g.y-h/2, w, h, 8); tctx.fill(); tctx.stroke();
    tctx.fillStyle = g.T.color; tctx.fillText(g.name, g.x, g.y + 1.5);
    return;
  }
  if (selected !== null){
    /* picked movie: trunk to each shared name (thicker the more movies it leads to), then a branch to each movie */
    stepHubs();
    const S = N[selected], sx = S.x+S.dx, sy = S.y+S.dy;
    ctx.globalAlpha = .92;
    for (const h of hubs){
      ctx.strokeStyle = h.color;
      ctx.lineWidth = Math.min(15, 2.5 + (h.movies.length-1)*3);
      ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(h.x, h.y); ctx.stroke();
      ctx.lineWidth = 2;
      for (const id of h.movies){ const m = N[id]; ctx.beginPath(); ctx.moveTo(h.x, h.y); ctx.lineTo(m.x+m.dx, m.y+m.dy); ctx.stroke(); }
    }
    tctx.textAlign = "center"; tctx.textBaseline = "middle"; tctx.globalAlpha = 1;
    for (const h of hubs){
      tctx.font = `600 ${h.px}px ${FONT}`;
      tctx.fillStyle = "#091627"; tctx.strokeStyle = h.color; tctx.lineWidth = 1.8;
      tctx.beginPath(); tctx.roundRect(h.x-h.w/2, h.y-h.hh/2, h.w, h.hh, 6); tctx.fill(); tctx.stroke();
      tctx.fillStyle = h.color; tctx.fillText(h.label, h.x, h.y + 1);
    }
    return;
  }
  /* names: bigger and bolder the more movies they link. Small ones only show up close. */
  let font = 0;
  const anyLit = hoverG !== null || hoverN !== null;
  for (const pass of [0, 1]) for (const g of TAGS_BY_SIZE){
    if (!g.on || lit(g) !== !!pass) continue;
    if (font !== g.px){ font = g.px; tctx.font = `600 ${g.px}px ${FONT}`; }
    if (!g.w) g.w = tctx.measureText(g.name).width + g.px*1.1;
    const near = pass ? 1 : Math.max(0, Math.min(1, (g.px*view.k - 5) / 1.6));
    if (near < .02) continue;
    const weight = Math.min(1, (g.all.length - 2) / 6);
    const a = pass ? 1 : near * (query ? .25 : (genre && g.movies.every(i => N[i].off)) ? .08 : (.5 + .45*weight) * (anyLit ? .45 : 1));
    tctx.globalAlpha = a * (pass ? 1 : .85); tctx.fillStyle = "#0c1c30";
    tctx.beginPath(); tctx.roundRect(g.x-g.w/2, g.y-g.h/2, g.w, g.h, 5); tctx.fill();
    tctx.globalAlpha = a * (pass ? 1 : .55); tctx.strokeStyle = g.T.color; tctx.lineWidth = pass ? 2 : 1; tctx.stroke();
    tctx.globalAlpha = a; tctx.fillStyle = g.T.color; tctx.fillText(g.name, g.x, g.y + 1);
  }

}
/* which name, if any, is under a point in the web */
function nameAt(clientX, clientY){
  const r = stage.getBoundingClientRect(), wx = (clientX-r.left-view.tx)/view.k, wy = (clientY-r.top-view.ty)/view.k;
  const over = (h, ht) => Math.abs(wx-h.x) < h.w/2 && Math.abs(wy-h.y) < ht/2;
  if (selected !== null){ const h = hubs.find(h => over(h, h.hh)); return h ? {name:h.label, k:h.T.k, hub:h} : null; }
  if (selTag) return null;
  let g = null;
  for (let i=TAGS_BY_SIZE.length-1; i>=0 && !g; i--){ const t = TAGS_BY_SIZE[i]; if (t.on && t.px*view.k > 5.5 && over(t, t.h + 4)) g = t; }
  return g ? {name:g.name, k:g.T.k, tag:g} : null;
}

/* ---------- WHO IS THIS: a short bio from Wikipedia ---------- */
const ROLE = {d:"film director", cast:"actor", wr:"screenwriter", m:"film composer", dp:"cinematographer", ed:"film editor", fr:"film series"};
const bioCache = new Map(); let bioFor = "";
const bio = document.getElementById("bio");
async function fetchBio(name, k){
  const key = name + "|" + k;
  if (bioCache.has(key)) return bioCache.get(key);
  try {
    const url = "https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrlimit=1&gsrsearch="
      + encodeURIComponent(name + " " + (ROLE[k] || "film"))
      + "&prop=extracts%7Cpageimages%7Cinfo&exintro=1&explaintext=1&exsentences=3&piprop=thumbnail&pithumbsize=200&pilicense=any&inprop=url";
    const j = await (await fetch(url)).json();
    const pg = j.query && j.query.pages && Object.values(j.query.pages)[0];
    const d = pg ? {title:pg.title, text:(pg.extract || "").trim(), img:pg.thumbnail && pg.thumbnail.source, url:pg.fullurl} : {none:true};
    bioCache.set(key, d); return d;
  } catch(e){ return {err:true}; }
}
function bioBody(d){
  if (!d) return `<p class="quiet">Looking this up on Wikipedia.</p>`;
  if (d.err) return `<p class="quiet">Wikipedia could not be reached. Check your internet connection and click the name again.</p>`;
  if (d.none || !d.text) return `<p class="quiet">Wikipedia has no short entry for this name.</p>`;
  return (d.img ? `<img src="${esc(d.img)}" alt="">` : "") + `<p>${esc(d.text)}</p>`
    + `<p class="src">From the Wikipedia article “${esc(d.title)}”. <a href="${esc(d.url)}" target="_blank" rel="noopener">Read the full article</a></p>`;
}
function paintBio(name, k, d){
  const T = TYPE[k] || TYPES[0];
  bio.innerHTML = `<button type="button" class="x" data-close aria-label="Close">×</button>
    <p class="role"><i style="--c:${T.color}"></i>${esc(T.name)}</p><h4>${esc(name)}</h4>${bioBody(d)}`;
  bio.hidden = false;
}
async function showBio(name, k){
  const key = name + "|" + k; bioFor = key;
  paintBio(name, k, bioCache.get(key));
  if (bioCache.has(key)) return;
  const d = await fetchBio(name, k);
  if (bioFor === key) paintBio(name, k, d);
}
/* clicking a name: a shared name becomes the center of the web; any other name gets the pop-up card */
function pickName(name, k){
  const g = G.find(g => g.on && g.name === name);
  if (g) selectTag(g); else showBio(name, k);
}
function closeBio(){ bio.hidden = true; bioFor = ""; }
bio.addEventListener("click", e => { if (e.target.closest("[data-close]")) closeBio(); });
for (const t of ["pointerdown","dblclick","wheel"]) bio.addEventListener(t, e => e.stopPropagation());

function frame(t){
  const ease = (p, g) => { const dx = g.x-p.x, dy = g.y-p.y; if (Math.abs(dx) + Math.abs(dy) < .06){ p.x = g.x; p.y = g.y; } else { p.x += dx*.18; p.y += dy*.18; } };
  for (const g of G) if (!g.drag) ease(g, g.home);
  for (const n of N){                                        // every poster glides to where it belongs right now
    if (n.drag) continue;
    const g = (focused() && n.ring) || n.home;
    ease(n, g);
  }
  if (viewTo){
    view.k += (viewTo.k - view.k)*.16; view.tx += (viewTo.tx - view.tx)*.16; view.ty += (viewTo.ty - view.ty)*.16;
    if (Math.abs(viewTo.tx - view.tx) + Math.abs(viewTo.ty - view.ty) < .5 && Math.abs(viewTo.k - view.k) < .002) viewTo = null;
  }
  let sum = view.k*1e5 + view.tx*13 + view.ty*7;
  for (const n of N) sum += n.x*1.3 + n.y*.7;
  for (const g of G) sum += g.x*.9 + g.y*1.1;
  if (focused() || needs > 0 || sum !== lastSum){ draw(t); lastSum = sum; needs--; }
  requestAnimationFrame(frame);
}


/* ---------- SELECTION + PANEL ---------- */
/* When a movie is picked, its relatives fan out around it. Every shared name
   appears once: one trunk from the movie to the name, then a branch to each
   movie that shares it. */
let ringKey = "", viewTo = null, savedView = null, hubs = [];
function bestOrder(ids, groups){
  const n = ids.length; if (n <= 2) return ids.slice();
  const multi = groups.filter(g => g.movies.length > 1);
  if (!multi.length) return ids.slice();
  const step = 2*Math.PI/n, cs = [], sn = [];
  for (let i=0; i<n; i++){ cs.push(Math.cos(i*step)); sn.push(Math.sin(i*step)); }
  const slot = new Map();
  const cost = order => {
    order.forEach((id,i) => slot.set(id, i));
    let c = 0;
    for (const g of multi){ let x = 0, y = 0; for (const id of g.movies){ const s = slot.get(id); x += cs[s]; y += sn[s]; } c += g.movies.length - Math.hypot(x, y); }
    return c;
  };
  if (n > 8){                                    // too many to try every order: group by first shared name
    const first = id => multi.findIndex(g => g.movies.includes(id));
    return ids.slice().sort((a,b) => (first(a) < 0 ? 99 : first(a)) - (first(b) < 0 ? 99 : first(b)));
  }
  let best = ids.slice(), bestC = cost(best);
  const rest = ids.slice(1), cur = [ids[0]];
  (function walk(pool){
    if (!pool.length){ const c = cost(cur); if (c < bestC - 1e-9){ bestC = c; best = cur.slice(); } return; }
    for (let i=0; i<pool.length; i++){ cur.push(pool[i]); walk(pool.slice(0,i).concat(pool.slice(i+1))); cur.pop(); }
  })(rest);
  return best;
}
function center(){                                           // what the fanned-out movies are arranged around
  if (selected !== null){ const S = N[selected]; return {key:S.m.t, x:S.home.x, y:S.home.y}; }
  return selTag ? {key:"@" + selTag.name, x:selTag.home.x, y:selTag.home.y} : null;
}
function arrangeTag(){
  const g = selTag, C = center(), ids = g.movies.slice(), n = ids.length;
  const RY = 330 + Math.max(0, n-6)*16, RX = RY*1.45, step = 2*Math.PI/n;
  ids.sort((a,b) => Math.atan2(N[a].home.y-C.y, N[a].home.x-C.x) - Math.atan2(N[b].home.y-C.y, N[b].home.x-C.x));
  let sx = 0, sy = 0;
  ids.forEach((id,i) => { const a = Math.atan2(N[id].home.y-C.y, N[id].home.x-C.x) - i*step; sx += Math.cos(a); sy += Math.sin(a); });
  const a0 = n === 2 ? Math.PI : Math.atan2(sy, sx);
  ids.forEach((id,i) => {
    const o = saved.ring[C.key + "|" + N[id].m.t];
    N[id].ring = o ? {x:C.x + o[0], y:C.y + o[1]} : {x:C.x + Math.cos(a0 + i*step)*RX, y:C.y + Math.sin(a0 + i*step)*RY};
  });
  const r = stage.getBoundingClientRect();
  const kt = Math.max(.4, Math.min(1.25, (r.height-120)/(2*(RY+150)), (r.width-60)/(2*(RX+120))));
  viewTo = {k:kt, tx:r.width/2 - C.x*kt, ty:r.height/2 + 8 - C.y*kt};
}
function arrange(){
  const types = TYPES.map(T => +T.on).join("");
  const key = selected !== null ? "m" + selected + ":" + types : selTag ? "t" + selTag.name + ":" + types : "";
  if (key === ringKey) return;
  ringKey = key; N.forEach(n => n.ring = null); hubs = [];
  if (!focused()){ if (savedView){ viewTo = savedView; savedView = null; } return; }
  if (!savedView) savedView = {k:view.k, tx:view.tx, ty:view.ty};
  if (selTag) return arrangeTag();
  const S = N[selected]; S.ring = {x:S.home.x, y:S.home.y};
  const list = nbrs[selected].map(e => ({e, n: N[e.a === selected ? e.b : e.a]}));
  // one tag per shared name
  const byName = new Map();
  for (const o of list) for (const T of o.e.kinds) for (const v of o.e.p.r[T.k]){
    const g = byName.get(v) || byName.set(v, {name:v, T, movies:new Set()}).get(v);
    g.movies.add(o.n.i); if (TYPES.indexOf(T) < TYPES.indexOf(g.T)) g.T = T;
  }
  hubs = [...byName.values()].map(g => ({
    label: g.name, T: g.T, color: g.T.color, movies: [...g.movies], x:0, y:0, w:0, init:false
  })).sort((a,b) => b.movies.length - a.movies.length);
  for (const h of hubs){
    h.user = (saved.hub || {})[S.m.t + "|" + h.label] || null;
    const g = G.find(g => g.name === h.label);
    h.px = Math.min(38, 20 + 5*Math.sqrt(Math.max(0, (g ? g.all.length : h.movies.length + 1) - 2)));   // more movies, bigger name
    h.hh = h.px + 12;
    if (g && !h.user){ h.ox = g.x - S.x; h.oy = g.y - S.y; h.init = true; }
  }
  const n = list.length;
  const RY = 380 + Math.max(0, n-6)*16, RX = RY*1.45;
  if (n){
    const order = bestOrder(list.map(o => o.n.i), hubs), step = 2*Math.PI/n;
    let sx = 0, sy = 0;
    order.forEach((id,i) => { const a = Math.atan2(N[id].home.y - S.home.y, N[id].home.x - S.home.x) - i*step; sx += Math.cos(a); sy += Math.sin(a); });
    let a0 = Math.atan2(sy, sx); if (n === 1) a0 = 0; else if (n === 2) a0 = Math.PI;
    order.forEach((id,i) => {
      const o = saved.ring[S.m.t + "|" + N[id].m.t];
      N[id].ring = o ? {x:S.home.x + o[0], y:S.home.y + o[1]}
                     : {x:S.home.x + Math.cos(a0 + i*step)*RX, y:S.home.y + Math.sin(a0 + i*step)*RY};
    });
  }
  const r = stage.getBoundingClientRect();
  const kt = Math.max(.4, Math.min(1.15, (r.height-120)/(2*(RY+150)), (r.width-60)/(2*(RX+120))));
  viewTo = {k:kt, tx:r.width/2 - S.home.x*kt, ty:r.height/2 + 8 - S.home.y*kt};
}
function paintNodes(){
  poke();

  const lit = new Set();
  if (selected !== null){ lit.add(selected); for (const e of nbrs[selected]) lit.add(e.a === selected ? e.b : e.a); }
  else if (selTag) selTag.movies.forEach(i => lit.add(i));
  const q = query.trim().toLowerCase(), f = focused();
  const filtered = TYPES.some(T => !T.on);

const trail = [];                                            // where you have been, most recent last
function remember(next){
  const here = selected !== null ? {m:selected} : selTag ? {g:selTag} : null;

function select(i, back){ if (!back) remember({m:i}); selected = i; selTag = null; closeBio(); paintNodes(); renderPanel(); }
function selectTag(g, back){ if (!back) remember({g}); selTag = g; selected = null; closeBio(); paintNodes(); renderPanel(); }

function row(label, list, k){ return list && list.length ? `<div><dt>${label}</dt><dd>${list.map(v => k ? who(v, k) : esc(v)).join(", ")}</dd></div>` : ""; }

/* which movies link to the most other movies: by any link, then by each kind of link */
function connected(){

    for (const p of PAIRS.values()){ if (N[p.a].off || N[p.b].off || !test(p)) continue; c.set(p.a, (c.get(p.a) || 0) + 1); c.set(p.b, (c.get(p.b) || 0) + 1); }

    const li = n => `<li><button class="go" data-go="${n.i}">${esc(n.m.t)}</button><span class="n">${fmtScore(scoreOf(n))}</span></li>`;
    panel.innerHTML = `<h1>Confused Breakfast Movie Web</h1>
      <p class="meta">${N.length} movies rated on the show, joined by ${G.filter(g => g.on).length} shared names. The higher the score, the bigger the poster.</p>${posterMiss && posterMiss.length ? `<details class="miss"><summary>${posterMiss.length} ${posterMiss.length === 1 ? "poster" : "posters"} could not be found</summary><p>${posterMiss.map(esc).join("; ")}</p></details>` : ""}
      <ul class="how"><li>Switch between All, AJ, Mike, and Sean to size the posters by that score.</li>
      <li>Pick a genre to fade everything else.</li>
      <li>Point at a poster or a name to light up its connections. Bigger names link more movies.</li>
      <li>Click a poster for its scores and connections. Click a name to center it and read a short bio.</li>
      <li>Drag anything and it stays put. Scroll, pinch, or use + and &minus; to zoom.</li></ul>
      <p class="also"><a href="by-the-numbers.html">See the show by the numbers</a>: favorite directors, biggest fights, and who grades hardest.</p>
      <p class="credit">Made by Trevor Brightman, a fan of the show. Scores as of October 5, 2026.</p>
      <div class="tabs" role="group" aria-label="Lists"><button type="button" data-tab="movies" aria-pressed="${panelTab === "movies"}">Top rated</button><button type="button" data-tab="people" aria-pressed="${panelTab === "people"}">Most featured</button><button type="button" data-tab="links" aria-pressed="${panelTab === "links"}">Most connected</button></div>`
      + (panelTab === "movies"
        ? `<h3>Highest rated ${whose}</h3><ul class="top">${ranked.slice(0,10).map(li).join("")}</ul>
           <h3>Lowest rated ${whose}</h3><ul class="top">${ranked.slice(-5).reverse().map(li).join("")}</ul>`
        : panelTab === "people" ? featured() : connected());
  } else {
    const m = SHELF[selected];
    const list = nbrs[selected].map(e => ({e, o: SHELF[e.a === selected ? e.b : e.a], oi: e.a === selected ? e.b : e.a}))
      .sort((a,b) => b.e.w - a.e.w || a.o.t.localeCompare(b.o.t));
    const body = scoreRows(m) + `<dl class="bill">${row("Directed by", m.d, "d")}${row("Written by", m.wr, "wr")}${row("Starring", m.cast, "cast")}${row("Music by", m.m, "m")}${row("Photography", m.dp, "dp")}</dl>`;
    const links = list.length
      ? `<h3>Shares something with ${list.length} ${list.length === 1 ? "movie" : "movies"}</h3><ul class="links">` + list.map(({e,o,oi}) =>
          `<li><button class="go" data-go="${oi}">${esc(o.t)}${o.y ? `<span>${o.y}</span>` : ""}</button><ul class="why">` +
          e.kinds.map(T => `<li><i style="--c:${T.color}"></i><span><em>${T.name}:</em> ${e.p.r[T.k].map(v => who(v, T.k)).join(", ")}</span></li>`).join("") + `</ul></li>`).join("") + `</ul>`
      : `<h3>A loner</h3><p>No other movie rated on the show shares a director, writer, composer, cinematographer, or lead actor with it.</p>`;
    panel.innerHTML = `${backBar()}
      <h2>${esc(m.t)}</h2>
      <p class="meta">${[m.y].concat(m.g).map(esc).join(", ")}</p>${body}${links}`;
    panel.scrollTop = 0;
  }
}
panel.addEventListener("click", e => {
  const tb = e.target.closest("[data-tab]"); if (tb){ panelTab = tb.dataset.tab; const y = panel.scrollTop; renderPanel(); panel.scrollTop = y; return; }
  const w = e.target.closest("[data-who]"); if (w) return pickName(w.dataset.who, w.dataset.k);
  const go = e.target.closest("[data-go]"); if (go) return select(+go.dataset.go);
  if (e.target.closest("[data-back]")) return goBack();
  if (e.target.closest("[data-clear]")) clearFocus();
});
addEventListener("keydown", e => { if (e.key === "Escape" && !bio.hidden){ closeBio(); return; } if (e.key === "Escape" && focused()) goBack(); });

/* ---------- TOOLBAR ---------- */
function renderBar(){
  bar.innerHTML = `<span class="seg" role="group" aria-label="Whose scores size the posters">${RATERS.map(([k,l]) => `<button type="button" data-rater="${k}" aria-pressed="${k === rater}">${l}</button>`).join("")}</span>`
    + `<select id="genre" aria-label="Genre"><option value="">All genres</option>${GENRES.map(g => `<option${g === genre ? " selected" : ""}>${g}</option>`).join("")}</select>`
    + TYPES.map(T => `<button type="button" class="chip" style="--c:${T.color}" aria-pressed="${T.on}" data-type="${T.k}"><i></i>${T.name} <b>${G.filter(g => g.by[T.k]).length}</b></button>`).join("")
    + `<input id="find" type="search" placeholder="Find a movie" aria-label="Find a movie" value="${esc(query)}">`;
}
bar.addEventListener("click", e => {
  const rb = e.target.closest("[data-rater]");
  if (rb){
    rater = rb.dataset.rater;
    bar.querySelectorAll("[data-rater]").forEach(b => b.setAttribute("aria-pressed", b === rb));
    applySizes(); renderPanel(); return;
  }
  const c = e.target.closest("[data-type]"); if (!c) return;
  const T = TYPE[c.dataset.type]; T.on = !T.on; c.setAttribute("aria-pressed", T.on);
  rebuildEdges(); if (selTag && !selTag.on) selTag = null;
  paintNodes(); renderPanel();
});
bar.addEventListener("input", e => { if (e.target.id === "find"){ query = e.target.value; paintNodes(); } });
bar.addEventListener("change", e => { if (e.target.id === "genre"){ genre = e.target.value; paintNodes(); renderPanel(); } });
bar.addEventListener("keydown", e => {
  if (e.target.id !== "find" || e.key !== "Enter") return;
  const q = query.trim().toLowerCase(), hit = q && N.find(n => n.m.t.toLowerCase().includes(q));
  if (hit) select(hit.i);
});
bar.addEventListener("pointerdown", e => e.stopPropagation());
document.getElementById("fit").addEventListener("click", () => { userMoved = false; viewTo = null; savedView = null; fit(); });
document.getElementById("reset").addEventListener("click", () => {
  saved = {home:{}, ring:{}, hub:{}}; persist();
  trail.length = 0; selected = null; selTag = null; savedView = null; viewTo = null; placeAll();
  paintNodes(); renderPanel(); userMoved = false; fit();
});

/* ---------- POINTER: drag posters, pan, zoom ---------- */
let ptr = null, pinch = null;
const pts = new Map();
function pinchState(){
  const [a,b] = [...pts.values()], r = stage.getBoundingClientRect();
  return {d: Math.hypot(a.x-b.x, a.y-b.y) || 1, mx:(a.x+b.x)/2 - r.left, my:(a.y+b.y)/2 - r.top};
}
stage.addEventListener("pointerdown", e => {
  pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (pts.size === 2){
    if (ptr && ptr.n) ptr.n.drag = false;
    if (ptr && ptr.tag) ptr.tag.drag = false;
    ptr = null; stage.classList.remove("panning"); pinch = pinchState();
    stage.setPointerCapture(e.pointerId); return;
  }
  if (pts.size > 2) return;
  const hitName = nameAt(e.clientX, e.clientY);
  if (hitName && hitName.hub){                               // name tags: click for a bio, or drag to move
    const h = hitName.hub;
    ptr = {id:e.pointerId, x:e.clientX, y:e.clientY, hub:h, hx:h.x, hy:h.y, moved:false}; stage.setPointerCapture(e.pointerId); return;
  }
  if (hitName && hitName.tag){                               // same in the whole web
    const g = hitName.tag;
    ptr = {id:e.pointerId, x:e.clientX, y:e.clientY, tag:g, hx:g.x, hy:g.y, moved:false}; stage.setPointerCapture(e.pointerId); return;
  }
  const el = e.target.closest(".node"), n = el && N.find(n => n.el === el);
  ptr = {id:e.pointerId, x:e.clientX, y:e.clientY, n, moved:false, tx:view.tx, ty:view.ty, nx:n && n.x, ny:n && n.y};
  stage.setPointerCapture(e.pointerId);
});
stage.addEventListener("pointermove", e => {
  if (pts.has(e.pointerId)) pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (!ptr && !pinch && e.pointerType !== "touch"){
    const ui = e.target.closest("#bar,#zoom,#bio"), hit = ui ? null : nameAt(e.clientX, e.clientY);
    const el = !ui && !hit && e.target.closest(".node"), hn = el ? N.findIndex(n => n.el === el) : null, hg = hit && hit.tag ? hit.tag : null;
    stage.style.cursor = hit && !e.target.closest(".node") ? "pointer" : "";
    if (hn !== hoverN || hg !== hoverG){ hoverN = hn; hoverG = hg; poke(); }
  }
  if (pinch && pts.size >= 2){
    const now = pinchState();
    zoomAt(now.mx, now.my, now.d/pinch.d);
    view.tx += now.mx - pinch.mx; view.ty += now.my - pinch.my;
    pinch = now; return;
  }
  if (!ptr || e.pointerId !== ptr.id) return;
  const dx = e.clientX-ptr.x, dy = e.clientY-ptr.y;
  if (!ptr.moved && Math.hypot(dx,dy) < 5) return;
  ptr.moved = true;
  if (ptr.tag){ const g = ptr.tag; g.drag = true; g.x = ptr.hx + dx/view.k; g.y = ptr.hy + dy/view.k; g.home = {x:g.x, y:g.y}; return; }
  if (ptr.hub){ const S = N[selected]; if (S) ptr.hub.user = [ptr.hx + dx/view.k - S.x - S.dx, ptr.hy + dy/view.k - S.y - S.dy]; return; }
  if (ptr.n){
    const n = ptr.n; n.drag = true; n.x = ptr.nx + dx/view.k; n.y = ptr.ny + dy/view.k;
    if (focused() && n.ring && n.i !== selected) n.ring = {x:n.x, y:n.y};          // rearranging the branches of whatever is picked
    else { n.home = {x:n.x, y:n.y}; if (n.ring) n.ring = {x:n.x, y:n.y}; }             // rearranging the main web
  }
  else { userMoved = true; viewTo = null; stage.classList.add("panning"); view.tx = ptr.tx + dx; view.ty = ptr.ty + dy; }
});
function endPtr(e){
  pts.delete(e.pointerId); if (pts.size < 2) pinch = null;
  if (!ptr || e.pointerId !== ptr.id) return;
  if (ptr.tag){
    const g = ptr.tag; g.drag = false;
    if (ptr.moved){ saved.home["@" + g.name] = [Math.round(g.x*10)/10, Math.round(g.y*10)/10]; persist(); }
    else selectTag(g);
    ptr = null; return;
  }
  if (ptr.hub){
    if (ptr.moved && ptr.hub.user && selected !== null){ saved.hub[N[selected].m.t + "|" + ptr.hub.label] = ptr.hub.user.map(v => Math.round(v*10)/10); persist(); }
    if (!ptr.moved) pickName(ptr.hub.label, ptr.hub.T.k);
    ptr = null; return;
  }
  if (ptr.n){
    const n = ptr.n; n.drag = false;
    if (ptr.moved){
      const r1 = v => Math.round(v*10)/10;
      if (focused() && n.ring && n.i !== selected){ const C = center(); saved.ring[C.key + "|" + n.m.t] = [r1(n.x - C.x), r1(n.y - C.y)]; }
      else saved.home[n.m.t] = [r1(n.x), r1(n.y)];
      persist();
    }
  }
  if (!ptr.moved){
    if (ptr.n) select(ptr.n.i);
    else if (focused()) clearFocus();
  }
  stage.classList.remove("panning"); ptr = null;
}
stage.addEventListener("pointerleave", () => { if (hoverN !== null || hoverG){ hoverN = null; hoverG = null; poke(); } });
stage.addEventListener("pointerup", endPtr); stage.addEventListener("pointercancel", endPtr);
const ZMIN = .2, ZMAX = 8;
function zoomAt(mx, my, factor){
  userMoved = true; viewTo = null;
  const k = Math.min(ZMAX, Math.max(ZMIN, view.k * factor));
  view.tx = mx - (mx-view.tx)*k/view.k; view.ty = my - (my-view.ty)*k/view.k; view.k = k;
}
function zoomCenter(factor){ const r = stage.getBoundingClientRect(); zoomAt(r.width/2, r.height/2, factor); }
stage.addEventListener("wheel", e => {
  e.preventDefault();
  const r = stage.getBoundingClientRect();
  let d = e.deltaY; if (e.deltaMode === 1) d *= 16; else if (e.deltaMode === 2) d *= 400;
  // trackpad pinch arrives as tiny ctrl+wheel steps, so it needs a much stronger factor
  zoomAt(e.clientX-r.left, e.clientY-r.top, Math.exp(-d * (e.ctrlKey ? 0.012 : 0.0025)));
}, {passive:false});
// Safari reports pinch as gesture events instead of wheel
let gk = 1;
stage.addEventListener("gesturestart", e => { e.preventDefault(); gk = 1; });
stage.addEventListener("gesturechange", e => {
  e.preventDefault(); const r = stage.getBoundingClientRect();
  zoomAt(e.clientX-r.left, e.clientY-r.top, e.scale/gk); gk = e.scale;
});
stage.addEventListener("gestureend", e => e.preventDefault());
for (const t of ["gesturestart","gesturechange","gestureend"]) document.addEventListener(t, e => e.preventDefault());
document.addEventListener("wheel", e => { if (e.ctrlKey) e.preventDefault(); }, {passive:false});
stage.addEventListener("dblclick", e => {
  if (e.target.closest("#bar,#zoom")) return;
  const r = stage.getBoundingClientRect(); zoomAt(e.clientX-r.left, e.clientY-r.top, e.shiftKey ? 1/1.8 : 1.8);
});
document.getElementById("zoom").addEventListener("click", e => {
  const b = e.target.closest("[data-z]"); if (b) zoomCenter(b.dataset.z === "in" ? 1.4 : 1/1.4);
});
document.getElementById("zoom").addEventListener("pointerdown", e => e.stopPropagation());
document.getElementById("zoom").addEventListener("dblclick", e => e.stopPropagation());
addEventListener("keydown", e => {
  if (e.target.matches("input") || e.metaKey || e.ctrlKey) return;
  if (e.key === "+" || e.key === "=") zoomCenter(1.4);
  else if (e.key === "-" || e.key === "_") zoomCenter(1/1.4);
  else if (e.key === "0"){ userMoved = false; viewTo = null; savedView = null; fit(); }
});
addEventListener("resize", () => { resize(); if (!userMoved) fit(); });

/* ---------- POSTERS (looked up from Wikipedia when the file opens) ---------- */
async function loadPosters(){
  let cache = {};
  try { cache = JSON.parse(localStorage.getItem("cbweb-posters-1") || "{}"); } catch(e){}
  const put = (n, src) => { const img = n.el.querySelector("img"); img.onload = () => n.el.classList.add("has-img"); img.onerror = () => { delete cache[n.m.w]; try { localStorage.setItem("cbweb-posters-1", JSON.stringify(cache)); } catch(e){} }; img.src = src; };
  const need = [];
  N.forEach(n => { if (!n.m.w) return; if (cache[n.m.w]) put(n, cache[n.m.w]); else need.push(n); });
  for (let i=0; i<need.length; i+=40){
    const group = need.slice(i, i+40);
    try {
      const url = "https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&redirects=1&prop=pageimages&piprop=thumbnail&pithumbsize=330&pilicense=any&pilimit=50&titles="
        + encodeURIComponent(group.map(n => n.m.w).join("|"));
      const q = (await (await fetch(url)).json()).query || {};
      const hop = {}; for (const x of (q.normalized||[]).concat(q.redirects||[])) hop[x.from] = x.to;
      const src = {}; for (const p of Object.values(q.pages||{})) if (p.thumbnail) src[p.title] = p.thumbnail.source;
      for (const n of group){
        let t = n.m.w; for (let h=0; h<3 && hop[t]; h++) t = hop[t];
        if (src[t]){ cache[n.m.w] = src[t]; put(n, src[t]); }
      }
    } catch(e){ /* offline: title cards stay */ }
  }
  const left = N.filter(n => n.m.w && !cache[n.m.w]);
  let online = true;
  for (let i=0; i<left.length && online; i+=6){
    await Promise.all(left.slice(i, i+6).map(async n => {
      try {
        const url = "https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrlimit=1&gsrsearch="
          + encodeURIComponent(n.m.t + " " + n.m.y + " film") + "&prop=pageimages&piprop=thumbnail&pithumbsize=330&pilicense=any";
        const j = await (await fetch(url)).json();
        const pg = j.query && j.query.pages && Object.values(j.query.pages)[0];
        if (pg && pg.thumbnail){ cache[n.m.w] = pg.thumbnail.source; put(n, pg.thumbnail.source); }
      } catch(e){ online = false; }
    }));
  }
  try { localStorage.setItem("cbweb-posters-1", JSON.stringify(cache)); } catch(e){}
  posterMiss = online ? N.filter(n => !cache[n.m.w]).map(n => n.m.t) : null;
  if (!focused()) renderPanel();
}

/* ---------- GO ---------- */
rebuildEdges(); renderBar(); loadSaved(); placeAll(); applySizes(); resize();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { G.forEach(g => g.w = 0); poke(); });
fit(); paintNodes(); renderPanel(); loadPosters();
requestAnimationFrame(frame);
</script>
